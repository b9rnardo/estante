<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do app: as três lombadas do favicon (public/index.html), de pé numa prateleira,
       sobre o papel do fundo da estante. Grade de ícones do macOS: corpo de 824px com margem de 100px. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefdfa"/>
      <stop offset="1" stop-color="#efe9de"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0653c"/>
      <stop offset=".45" stop-color="#b0532c"/>
      <stop offset="1" stop-color="#9a4423"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#da9670"/>
      <stop offset=".45" stop-color="#cd8560"/>
      <stop offset="1" stop-color="#bb7350"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efc8a9"/>
      <stop offset=".45" stop-color="#e6b896"/>
      <stop offset="1" stop-color="#d9a783"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3530"/>
      <stop offset="1" stop-color="#1c1b19"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1c1b19" flood-opacity=".3"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#paper)" filter="url(#drop)"/>
  <rect x="101" y="101" width="822" height="822" rx="184.4" fill="none" stroke="#1c1b19" stroke-opacity=".06" stroke-width="2"/>

  <!-- Lombadas: a última se apoia na do meio. Faixas claras no topo e no pé, como em livro encadernado. -->
  <rect x="274" y="288" width="126" height="468" rx="16" fill="url(#b1)"/>
  <rect x="274" y="334" width="126" height="12" fill="#f8e9d6" opacity=".55"/>
  <rect x="274" y="690" width="126" height="12" fill="#f8e9d6" opacity=".55"/>

  <rect x="422" y="236" width="112" height="520" rx="16" fill="url(#b2)"/>
  <rect x="422" y="282" width="112" height="12" fill="#fbf0e2" opacity=".6"/>
  <rect x="422" y="690" width="112" height="12" fill="#fbf0e2" opacity=".6"/>

  <g transform="rotate(-14 637 756)">
    <rect x="637" y="320" width="118" height="436" rx="16" fill="url(#b3)"/>
    <rect x="637" y="366" width="118" height="12" fill="#b0532c" opacity=".28"/>
    <rect x="637" y="690" width="118" height="12" fill="#b0532c" opacity=".28"/>
  </g>

  <!-- Prateleira -->
  <rect x="214" y="790" width="596" height="14" rx="7" fill="#1c1b19" opacity=".22" filter="url(#soft)"/>
  <rect x="196" y="756" width="632" height="30" rx="9" fill="url(#wood)"/>
  <rect x="204" y="757" width="616" height="3" rx="1.5" fill="#fff" opacity=".12"/>
</svg>
